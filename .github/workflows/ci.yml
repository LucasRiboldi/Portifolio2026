name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tokens em sincronia
        run: npm run tokens:check

      - name: Lint
        run: npm run lint

      # Os 535 testes rodavam só na máquina do dev — um PR podia quebrar a
      # suíte inteira e o CI ficava verde. Eles não usam rede nem credencial,
      # então não precisam de secrets.
      - name: Testes
        run: npm run test:unit

      # `next build` já faz a checagem de tipos (não há
      # typescript.ignoreBuildErrors no next.config), então não há passo
      # separado de tsc.
      - name: Build
        run: npm run build
